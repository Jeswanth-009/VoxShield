base: base.yaml

# Measured on this machine: batch 16 is faster than batch 8 or 32 while
# retaining the full 20,000 dynamic examples per epoch.
train:
  batch_size: 16
  num_workers: 2
  persistent_workers: true
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0001
  checkpoint_dir: checkpoints_v2
  run_dir: runs_v2
