base: deep_filter_v10b_stoi_resume.yaml

# Resume-path stability check: verifies that the partial v10b checkpoint can
# continue with full-precision gradients before the remaining real epochs run.
data:
  samples_per_epoch: 32
train:
  epochs: 7
  batch_size: 4
  num_workers: 0
  persistent_workers: false
  checkpoint_dir: checkpoints_deep_filter_v10b_resume_smoke
  run_dir: runs_deep_filter_v10b_resume_smoke
