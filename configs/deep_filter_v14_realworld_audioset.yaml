base: deep_filter_v10.yaml
recipe_version: 17

# V14 is the data-first real-world repair run. It starts from the proven v10
# checkpoint and adds user-recorded laptop demo audio plus targeted AudioSet
# defence-like noises, without overwriting v10/v12/v13 results.
model:
  initialize_from: checkpoints_deep_filter_v10/best.pt

data:
  samples_per_epoch: 4500
  train_clean_manifest: data/manifests_v14/clean_train.jsonl
  val_clean_manifest: data/manifests_v14/clean_val.jsonl
  train_noise_manifests:
    stationary: data/manifests_v14/noise_stationary_train.jsonl
    nonstationary: data/manifests_v14/noise_nonstationary_train.jsonl
    impulsive: data/manifests_v14/noise_impulsive_train.jsonl
    environmental: data/manifests_v14/noise_environmental_train.jsonl
  val_noise_manifests:
    stationary: data/manifests_v14/noise_stationary_val.jsonl
    nonstationary: data/manifests_v14/noise_nonstationary_val.jsonl
    impulsive: data/manifests_v14/noise_impulsive_val.jsonl
    environmental: data/manifests_v14/noise_environmental_val.jsonl
  train_rir_manifest: data/manifests_v14/rir_train.jsonl
  val_rir_manifest: data/manifests_v14/rir_val.jsonl
  required_validation_datasets: []

  clipping_probability: 0.30
  clipping_threshold: [0.22, 0.85]
  spectral_tilt_probability: 0.60
  reverb_probability: 0.35
  clean_probability: 0.24
  near_clean_probability: 0.24
  snr_db: [-14.0, 12.0]
  snr_sampling_ranges:
    - {min: -18.0, max: -8.0, weight: 1.6}
    - {min: -8.0, max: 4.0, weight: 2.1}
    - {min: 4.0, max: 16.0, weight: 1.0}
  multi_noise_probability: 0.45

  interchannel_delay_samples: [-32, 32]
  reference_noise_gain_db: [-10.0, 8.0]
  reference_speech_leak_db: [-18.0, -1.5]
  reference_self_noise_snr_db: [18.0, 45.0]
  reference_tilt_probability: 0.85

  noise_dataset_weights:
    DNS-Challenge: 3.0
    MAD_dataset: 3.0
    musan: 1.5
    esc-50: 1.2
    user_recordings_wav: 4.0
    gunshot: 3.0
    explosion: 3.0
    footsteps: 2.2
    engine: 2.5
    vehicle: 2.5
    siren: 2.5
    helicopter: 3.5
    aircraft: 3.0
  noise_label_weights:
    aircon: 3.0
    fan: 4.0
    breathing: 2.0
    typing: 1.8
    street: 1.5
    gunshot: 2.5
    shelling: 2.5
    helicopter: 3.0
    fighter: 3.0
    vehicle: 2.5
  category_weights:
    stationary: 1.7
    nonstationary: 2.2
    impulsive: 2.2
    environmental: 1.3

loss:
  clean_identity: 1.6
  clean_spectral_identity: 1.1
  speech_retention: 2.8
  spectral_hole: 2.1
  spectral_delta: 2.1
  waveform_l1: 0.75

train:
  epochs: 12
  batch_size: 12
  learning_rate: 0.00005
  early_stopping_patience: 4
  checkpoint_dir: checkpoints_deep_filter_v14_realworld_audioset
  run_dir: runs_deep_filter_v14_realworld_audioset
  selection_weights:
    total: 1.0
    clean_identity: 2.0
    clean_spectral_identity: 1.5
    speech_retention: 2.2
