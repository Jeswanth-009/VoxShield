base: gtcrn_v5_mono_repair.yaml
recipe_version: 9
model:
  architecture: fusion_dual_ulunas
  # Clear the v5 GTCRN checkpoint — this is a different architecture
  initialize_from: null
  pretrained: external/ul-unas/checkpoints/model_trained_on_dns3.tar
data:
  # Dual-channel synthesis (reference-mic simulation) from the v4 recipe,
  # applied to the v5 manifests so military noise stays oversampled.
  multichannel: true
  interchannel_delay_samples: [-16, 16]
  reference_noise_gain_db: [-6.0, 6.0]
  reference_speech_leak_db: [-35.0, -12.0]
  reference_self_noise_snr_db: [35.0, 55.0]
  reference_tilt_probability: 0.50
  samples_per_epoch: 2000
  noise_dataset_weights:
    MAD_dataset: 4.0
train:
  epochs: 3
  batch_size: 8
  learning_rate: 0.00002
  freeze_batch_norm_stats: true
  checkpoint_dir: checkpoints_fusion_v7_pilot
  run_dir: runs_fusion_v7_pilot
