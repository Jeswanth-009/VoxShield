[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxshield"
version = "4.0.0"
description = "Causal hybrid dual-channel speech enhancement and ANC research platform"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "soundfile>=0.12,<1",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "einops==0.7.0",
]

[project.optional-dependencies]
train = ["torch>=2.2,<3", "tensorboard>=2.16,<3"]
eval = ["pystoi>=0.4,<1", "psutil>=5.9,<7"]
pesq = ["pesq>=0.0.4,<1"]
onnx = ["onnx>=1.16,<2", "onnxruntime>=1.18,<2"]
live = ["sounddevice>=0.4.6,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
voxshield-data = "voxshield.data.index:main"
voxshield-train = "voxshield.train:main"
voxshield-infer = "voxshield.infer:main"
voxshield-evaluate = "voxshield.evaluate:main"
voxshield-export = "voxshield.export_onnx:main"
voxshield-export-tensorrt = "voxshield.export_tensorrt:main"
voxshield-benchmark = "voxshield.benchmark:main"
voxshield-live = "voxshield.live:main"
voxshield-live-dual-device = "voxshield.live_dual_device:main"
voxshield-smoke = "voxshield.smoke:main"
voxshield-capture = "voxshield.capture:main"
voxshield-anc-simulate = "voxshield.anc_simulate:main"
voxshield-compare = "voxshield.compare:main"
voxshield-quantize = "voxshield.quantize_onnx:main"
voxshield-readiness = "voxshield.readiness:main"
voxshield-dashboard = "voxshield.dashboard:main"
voxshield-convert-uav = "voxshield.convert_uav:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["external"]
